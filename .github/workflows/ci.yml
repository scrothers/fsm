name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Debian 13 (current),        image: "debian:13",    family: debian }
          - { name: Debian 12 (previous),       image: "debian:12",    family: debian }
          - { name: Ubuntu 26.04 LTS (latest),  image: "ubuntu:26.04", family: debian }
          - { name: Ubuntu 24.04 LTS (current), image: "ubuntu:24.04", family: debian }
          - { name: Fedora 44 (current),        image: "fedora:44",    family: fedora }
          - { name: Fedora 43 (previous),       image: "fedora:43",    family: fedora }
    steps:
      - name: Install system dependencies
        run: |
          if [ "${{ matrix.family }}" = "debian" ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y python3 python3-venv python3-pip git ca-certificates
          else
            dnf install -y python3 python3-pip git tar
          fi
      - uses: actions/checkout@v4
      - name: Report Python
        run: python3 --version
      - name: Create venv and install
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'
      - name: Lint (pyflakes)
        run: .venv/bin/python -m pyflakes src/factorio_server_manager tests
      - name: Test
        run: .venv/bin/python -m pytest -q
