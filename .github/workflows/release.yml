name: Release

# Publishes to PyPI when a version tag (vX.Y.Z) is pushed, via PyPI Trusted
# Publishing (OIDC) — no API token is stored. Configure the trusted publisher
# once at https://pypi.org/manage/project/factorio-server-manager/settings/publishing/
# with owner "scrothers", repo "fsm", workflow "release.yml", environment "pypi".

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/factorio-server-manager
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
