name: Release

# On a version tag (vX.Y.Z): build, publish to PyPI via Trusted Publishing
# (OIDC, no stored token), then create a GitHub Release with the CHANGELOG notes
# and the built artifacts attached. Configure the PyPI trusted publisher once at
# https://pypi.org/manage/project/factorio-server-manager/settings/publishing/
# with owner "scrothers", repo "fsm", workflow "release.yml", environment "pypi".

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/factorio-server-manager
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            /^## \[/ && f { exit }
            f { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "----- notes -----"; cat RELEASE_NOTES.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s RELEASE_NOTES.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md dist/*
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --generate-notes dist/*
          fi
